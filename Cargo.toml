[package]
name = "octaglide-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
rtic = { version = "2", features = ["thumbv7-backend"] }
rtic-monotonics = { version = "1", default-features = false, features = ["cortex-m-systick"] }
rtic-sync = "1.4.0" 

imxrt-log = { version = "0.1", default-features = false, features = ["log", "usbd"] }
teensy4-panic = { version = "0.2", default-features = false }
log = { version = "0.4"}

midi-msg = { version = "0.8", default-features = false }
embedded-alloc = "0.6.0"
cortex-m = "0.7.7"
heapless = "0.9.1"
paste = "1.0"
futures = { version = "0.3", default-features = false }
enum_dispatch = "0.3.13"
libm = "0.2.15"

[dependencies.teensy4-bsp]
version = "0.5"
features = ["rt"]

[build-dependencies]
cc = "1.0"

# Don't optimize build dependencies, like proc macros.
# Helps with build times.
[profile.release.build-override]
opt-level = 0

[[bin]]
name = "octaglide-rs"
path = "src/main.rs"
test = false
doctest = false
bench = false

[profile.dev]
opt-level = "z"     # Optimize for size
# debug = true        # Keep debug symbols
# lto = "thin"        # Enable Link Time Optimization

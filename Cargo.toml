[package]
name = "octaglide-rs"
version = "0.1.0"
edition = "2024"

[features]
default = ["teensy"]
teensy = [
    "dep:rtic",
    "dep:rtic-monotonics",
    "dep:imxrt-log",
    "dep:teensy4-panic",
    "dep:embedded-alloc",
    "dep:cortex-m",
    "dep:cortex-m-rt",
    "dep:cortex-m-microclock",
    "dep:sh1106",
    "dep:imxrt-boot-gen",
    "dep:teensy-usbhost",
    "dep:teensy4-bsp",
    "dep:teensy4-fcb",
]
host = ["dep:tokio", "dep:embedded-graphics-simulator", "dep:critical-section"]

[dependencies]
rtic = { version = "2", features = ["thumbv7-backend"], optional = true }
rtic-monotonics = { version = "1", default-features = false, features = ["cortex-m-systick"], optional = true }
rtic-sync = "1.4.0"

imxrt-log = { version = "0.1", default-features = false, features = ["log", "usbd"], optional = true }
teensy4-panic = { version = "0.2", default-features = false, optional = true }
log = "0.4"

midi-msg = { version = "0.8", default-features = false }
embedded-alloc = { version = "0.6.0", optional = true }
cortex-m = { version = "0.7.7", optional = true }
cortex-m-rt = { version = "0.7", optional = true }
cortex-m-microclock = { version = "0.1", optional = true }
heapless = "0.9.1"
static_cell = "2"
paste = "1.0"
futures = { version = "0.3", default-features = false }
enum_dispatch = "0.3.13"
libm = "0.2.15"
sh1106 = { version = "0.5", optional = true }
embedded-graphics = "0.8"

imxrt-boot-gen = { version = "0.3", optional = true }

teensy-usbhost = { path = "teensy-usbhost", optional = true }

[dependencies.teensy4-bsp]
version = "0.5"
features = ["rt"]
optional = true

[dependencies.teensy4-fcb]
version = "0.4"
optional = true

[dependencies.tokio]
version = "1"
features = ["rt", "time"]
optional = true

[dependencies.embedded-graphics-simulator]
version = "0.8"
optional = true

[dependencies.critical-section]
version = "1.2"
features = ["std"]
optional = true

[target.'cfg(not(target_os = "none"))'.dependencies.futures]
version = "0.3"
features = ["async-await", "std"]

[build-dependencies]
# (empty - USB host C++ compilation moved to teensy-usbhost crate)

# Don't optimize build dependencies, like proc macros.
# Helps with build times.
[profile.release.build-override]
opt-level = 0

[[bin]]
name = "octaglide-rs"
path = "src/main.rs"
test = false
doctest = false
bench = false

[profile.dev]
opt-level = "z"     # Optimize for size
# debug = true        # Keep debug symbols
# lto = "thin"        # Enable Link Time Optimization
